name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k9:
    name: k9
    # Plan K9 template check (tools/k9-check.mjs, canonical in template-app + games-template, copied verbatim):
    # fails when the repo lacks unit tests, API tests, Playwright e2e, axe 2.2, a visual baseline, a coverage
    # floor, EL+EN strings or a health/ready endpoint. A known gap is report-only only when k9-allowlist.json
    # lists it with a written reason (a warning in the log); an entry for an item that exists fails (ratchet).
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: K9 check tests (node --test, no dependencies)
        run: node --test tools/k9-check.test.mjs
      - name: K9 template check (k9-allowlist.json = the visible, report-only gaps)
        run: node tools/k9-check.mjs

  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tests (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $out = @(powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or $out[-1] -notmatch '^TESTS pass=\d+ fail=0( |$)') { Write-Host '::error::tests failed under powershell'; exit 1 }

      - name: Tests (PowerShell 7)
        shell: pwsh
        run: |
          $out = @(pwsh -NoProfile -File tests\run-tests.ps1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or $out[-1] -notmatch '^TESTS pass=\d+ fail=0( |$)') { Write-Host '::error::tests failed under pwsh'; exit 1 }

      - name: Coverage ratchet (MIN_PASS / UNTESTED vs origin/main)
        shell: pwsh
        run: pwsh -NoProfile -File tests\check-ratchet.ps1 -BaseRef origin/main
